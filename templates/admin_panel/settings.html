{% extends "admin_panel/base_admin.html" %}
{% block title %}Settings — CareerMind AI{% endblock %}
{% block content %}
<h1 class="font-serif-display text-2xl text-maroon mb-6">Settings</h1>
<div class="card p-6 max-w-lg">
  <form method="post" class="space-y-4">
    {% csrf_token %}
    <div><label class="text-xs font-semibold text-[#7a6a5e]">DESIGNATION</label><input name="designation" value="{{ detail.designation }}" class="input-field mt-1"></div>
    <button type="submit" class="btn-maroon">Save Settings</button>
  </form>
</div>
{% endblock %}
